name: Security scan (IaC)

# Scan de configuration (pas de build d'image ici) - Terraform + manifestes Kubernetes.
# Voir docs/deployment/10-qualite-securite-code.md pour le détail des outils et la
# stratégie de gate (mode "rapport" tant que les findings existants n'ont pas été triés).

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

jobs:
  scan-iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy (config Terraform + Kubernetes)
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: trivy-iac-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy - publier les résultats dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac-results.sarif
          category: trivy-iac

      # `secrets` n'est pas utilisable dans un `if:` (erreur GitHub Actions "Unrecognized
      # named-value: 'secrets'") - continue-on-error fait le même travail : tant que
      # SNYK_TOKEN n'existe pas, l'étape échoue (token vide) mais le job continue sans
      # bloquer le pipeline. Voir docs/deployment/10-qualite-securite-code.md.
      - name: Snyk (IaC Terraform)
        uses: snyk/actions/iac@master
        continue-on-error: true
        with:
          args: infra/terraform --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
