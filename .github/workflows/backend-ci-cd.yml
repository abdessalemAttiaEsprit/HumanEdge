name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hr-backend

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # requis pour publier les résultats Trivy dans l'onglet Security
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Qualité & sécurité (voir docs/deployment/10-qualite-securite-code.md) ---
      # Mode "rapport" (exit-code 0) le temps de trier les findings existants - voir §10.5
      # de ce même chapitre pour la stratégie de passage en mode bloquant.
      - name: Trivy (scan de l'image)
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy - publier les résultats dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-backend

      # `secrets` n'est pas utilisable dans un `if:` (erreur GitHub Actions "Unrecognized
      # named-value: 'secrets'") - continue-on-error fait le même travail : tant que
      # SNYK_TOKEN/SONAR_TOKEN n'existent pas, l'étape échoue (token vide) mais le job
      # continue sans bloquer le pipeline. Voir docs/deployment/10-qualite-securite-code.md.
      - name: Snyk (dépendances Maven)
        uses: snyk/actions/maven@master
        continue-on-error: true
        with:
          args: --file=backend/pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: SonarCloud
        working-directory: backend
        continue-on-error: true
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-gitops-manifest:
    needs: build-test-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Bump backend image tag in overlays/prod
        working-directory: infra/k8s/overlays/prod
        run: |
          kustomize edit set image docker.io/CHANGE_ME/hr-backend=${{ env.IMAGE_NAME }}:${{ needs.build-test-push.outputs.image_tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): bump hr-backend image to ${{ needs.build-test-push.outputs.image_tag }}"
          git pull --rebase origin main
          git push
