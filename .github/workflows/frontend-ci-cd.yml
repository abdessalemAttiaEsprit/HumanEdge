name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend
  # Variable de repo (Settings > Secrets and variables > Actions > Variables), pas un
  # secret : c'est juste l'URL publique de l'API, baked in au build Vite.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # requis pour publier les résultats Trivy dans l'onglet Security
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Qualité & sécurité (voir docs/deployment/10-qualite-securite-code.md) ---
      # Mode "rapport" (exit-code 0) le temps de trier les findings existants - voir §10.5
      # de ce même chapitre pour la stratégie de passage en mode bloquant.
      - name: Trivy (scan de l'image)
        uses: aquasecurity/trivy-action@v0.32.0
        continue-on-error: true   # une panne du scanner (DB, registry...) ne doit jamais bloquer le déploiement
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy - publier les résultats dans l'onglet Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-frontend

      # `secrets` n'est pas utilisable dans un `if:` (erreur GitHub Actions "Unrecognized
      # named-value: 'secrets'") - continue-on-error fait le même travail : tant que
      # SNYK_TOKEN/SONAR_TOKEN n'existent pas, l'étape échoue (token vide) mais le job
      # continue sans bloquer le pipeline. Voir docs/deployment/10-qualite-securite-code.md.
      - name: Snyk (dépendances npm)
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --file=frontend/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        continue-on-error: true
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-gitops-manifest:
    needs: build-test-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Bump frontend image tag in overlays/prod
        working-directory: infra/k8s/overlays/prod
        run: |
          kustomize edit set image docker.io/CHANGE_ME/hr-frontend=${{ env.IMAGE_NAME }}:${{ needs.build-test-push.outputs.image_tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): bump hr-frontend image to ${{ needs.build-test-push.outputs.image_tag }}"
          git pull --rebase origin main
          git push
