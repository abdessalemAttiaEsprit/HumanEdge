apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-backend-config
  namespace: hr
data:
  CORS_ALLOWED_ORIGINS: "https://hr.human-edge.dev"
  FRONTEND_BASE_URL: "https://hr.human-edge.dev"
  # Activation temporaire et volontaire du seeding de demo sur cet environnement de demo/soutenance
  # (application-prod.properties garde app.seed-demo-data=false par defaut). A retirer apres le
  # premier peuplement reussi pour restaurer la garde-fou.
  APP_SEED_DEMO_DATA: "true"
