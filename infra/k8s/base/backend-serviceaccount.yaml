# Lié par Workload Identity au GSA hr-backend-sql (voir infra/terraform/workload-identity.tf)
# - permet au side-car cloud-sql-proxy du pod hr-backend de s'authentifier auprès de
# Cloud SQL via IAM, sans clé JSON ni IP autorisée. Voir
# docs/deployment/07-checklist-securite-budget.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hr-backend-ksa
  namespace: hr
  annotations:
    iam.gke.io/gcp-service-account: hr-backend-sql@hrapp-471203.iam.gserviceaccount.com
